# Aktualizacja „w powietrzu” (EAS Update) — bez budowania i instalowania APK. Uruchamiana:
#  - RĘCZNIE: GitHub → Actions → „Wyślij aktualizację” → Run workflow → kanał + krótki opis,
#  - albo znacznikiem: git tag aktualizacja-N && git push origin aktualizacja-N (kanał preview, opis = opis commita).
#   preview    = tablety z APK z „Buduj aplikację” (preview)
#   production = aplikacja z Google Play
# Tablety pobierają ją same (przy starcie / po powrocie do aplikacji).
# Dochodzi tylko do APK z tymi samymi modułami systemowymi — gdy doszedł nowy moduł, trzeba zbudować nowy APK.
# Wymaga sekretu EXPO_TOKEN (ten sam co do budowania).
name: Wyślij aktualizację
on:
  push:
    tags: ['aktualizacja-*']
  workflow_dispatch:
    inputs:
      kanal:
        description: 'Kanał'
        type: choice
        options: [preview, production]
        default: preview
      opis:
        description: 'Co się zmieniło (krótko)'
        type: string
        default: 'Poprawki'
jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Wyślij do EAS Update
        env:
          KANAL: ${{ inputs.kanal || 'preview' }}
          OPIS: ${{ inputs.opis }}
        run: |
          [ -n "$OPIS" ] || OPIS="$(git log -1 --format=%s)"
          eas update --platform android --channel "$KANAL" --environment "$KANAL" --message "$OPIS" --non-interactive
